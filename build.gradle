plugins {
    id 'java'
    id 'application'
}

group = 'issuetracker'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

application {
    mainClass = 'issuetracker.Main'
}

test {
    useJUnitPlatform()
}